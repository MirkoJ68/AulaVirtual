{% extends "base.html" %}
{% block contenido %}
<section class="formulario">
    <h1>Iniciar sesión</h1>
    <form method="POST" novalidate>
        {{ form.hidden_tag() }}
        <label>{{ form.email.label }}{{ form.email(placeholder="tu@email.com") }}{% for error in form.email.errors %}<small class="error-campo">{{ error }}</small>{% endfor %}</label>
        <label>{{ form.password.label }}{{ form.password() }}{% for error in form.password.errors %}<small class="error-campo">{{ error }}</small>{% endfor %}</label>
        {{ form.submit(class_="boton") }}
    </form>
    <p>¿No tenés cuenta? <a href="{{ url_for('registro') }}">Registrate</a>.</p>
</section>
{% endblock %}
