{% extends "base.html" %}{% block contenido %}<section class="formulario"><h1>Nueva evaluación</h1><p>Curso: {{ curso.nombre }}</p><form method="POST">{{ form.hidden_tag() }}<label>{{ form.titulo.label }}{{ form.titulo() }}</label><label>{{ form.descripcion.label }}{{ form.descripcion(rows=3) }}</label><label>{{ form.preguntas.label }}{{ form.preguntas(rows=7, placeholder="¿Qué es Flask?\n¿Para qué se usa una base de datos?") }}</label><p class="ayuda">Escribí una pregunta por renglón.</p>{{ form.submit(class_="boton") }}</form></section>{% endblock %}
